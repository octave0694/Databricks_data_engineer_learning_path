version: "3.8"

services:
  spark-master:
    image: apache/spark:4.2.0
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      # Event logs pour le History Server
      - SPARK_MASTER_OPTS=-Dspark.eventLog.enabled=true -Dspark.eventLog.dir=/spark-events
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - spark-events:/spark-events
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:4.2.0
    container_name: spark-worker-1
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - spark-events:/spark-events
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:4.2.0
    container_name: spark-worker-2
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - spark-events:/spark-events
    networks:
      - spark-net

  spark-history:
    image: apache/spark:4.2.0
    container_name: spark-history
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/spark-events -Dspark.history.ui.port=18080
    command: /opt/spark/sbin/start-history-server.sh
    depends_on:
      - spark-master
    ports:
      - "18080:18080"
    volumes:
      - spark-events:/spark-events
    networks:
      - spark-net

  jupyter:
    image: jupyter/pyspark-notebook
    container_name: jupyter
    environment:
      # Optionnel : active JupyterLab
      - JUPYTER_ENABLE_LAB=yes
      # Indique au code où se trouve le master Spark
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      # (optionnel) accès aux mêmes events Spark que le History Server
      - spark-events:/spark-events
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge

volumes:
  spark-events: